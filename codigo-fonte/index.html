<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movvi</title>
    <link rel="stylesheet" href="./css/style.css"/>   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"> 
  

  </head>
  <body>
    
        
      <header class="top-header">
       <div class="nav-left">
        <p class="logo-header">Movvi</p>
        <nav class="nav-menu">
          <ul>
            <li><a href="#" >Explorar</a></li>
            <li><a href="#" >Categorias</a></li>
          
          </ul>
        </nav>
       </div>

       <div class="nav-rigth">
        <div class="search-bar">
<input class="search-input" type="text" placeholder="Pesquisar...">
<i class="fa-solid fa-magnifying-glass"></i>

        </div>
       
<button class="btn-primary btn-header">Entrar</button>
<button class="btn-primary btn-header">Criar conta</button>
        </div>

     <section class="hero" id="hero-banner">

      <div class="hero__content">
      <h1 class="hero__title" id="hero-title">Interestelar</h1>
      <p class="hero__description" id="hero-description">
        As reservas de recursos da Terra estão escassas. Um grupo de astronautas recebe a missão de verificar possíveis planetas para receberem a população mundial.
      </p>
      <div class="hero__actions">
        <button class="btn btn--hero-primary">Ver detalhes</button>
        <button class="btn btn--hero-secondary">Adicionar à lista</button>
      </div>
    </div>
    </section>
    </main>
