<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Listas</title>
    <link rel="stylesheet" href="./css/style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div id="header"></div>

    <main class="main-lists">
      <section class="profile">
        <div class="profile-header">
          <div class="profile-avatar" id="profile-avatar">NA</div>
          <div class="profile-heading">
            <p class="profile-name" id="profile-name">Naiara</p>
            <span class="profile-subtitle">Meu perfil</span>
          </div>
        </div>
      </section>
      <section class="lists-section">
        
        <h1 class="lists-heading">Minhas listas</h1>

        <div class="lists-container" id="lists-container"></div>
        <section class="selected-list" id="selected-list" hidden>
  <h2 class="selected-list-title" id="selected-list-title"></h2>

  <div class="selected-list-movies" id="selected-list-movies"></div>
</section>
      </section>
    </main>
    <div id="modal-create-list" hidden>
  <div>
    <div class="modal-header">
      <h2> <i class="fa-solid fa-film" aria-hidden="true"></i>Criar lista</h2>

      <button
        type="button"
        id="btn-close-modal" class="btn-close-modal"
        aria-label="Fechar modal"
      >
        <i class="fa-regular fa-circle-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <form id="form-create-list">
      <label for="list-name">Nome da lista</label>

      <input
        type="text"
        id="list-name"
        name="list-name"
        
        placeholder="Digite o nome da lista"
        required
      />
      <span id="list-name-error"></span>

      <button type="submit" class="btn-modal-primary">Criar</button>
      <button type="button" id="btn-cancel-list" class="btn-cancel-list">Cancelar</button>
    </form>
  </div>
</div>


<div id="modal-edit-list" hidden>
  <div>
    <div class="modal-header">
      <h2>
        <i class="fa-solid fa-pen-to-square" aria-hidden="true"></i>
        Editar lista
      </h2>

      <button
        type="button"
        id="btn-close-edit-modal"
        class="btn-close-modal"
        aria-label="Fechar modal de edição"
      >
        <i class="fa-regular fa-circle-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <form id="form-edit-list">
      <div class="edit-list-input">
      <label for="edit-list-name">Nome da lista</label>

      <input
        type="text"
        id="edit-list-name"
        name="edit-list-name"
        placeholder="Digite o nome da lista"
        minlength="3"
        maxlength="30"
        required
      />

      <span id="edit-list-name-error"></span>

      <h3>Filmes da lista (<span id="edit-list-movie-count">0</span>)</h3>
</div>
      
      <div id="edit-list-movies">
        <!-- Os filmes atuais serão inseridos pelo JavaScript -->
      </div>
      
<div class="edit-list-buttons">
      <button type="submit" class="btn-modal-primary">
        Salvar 
      </button>

      <button
        type="button"
        id="btn-cancel-edit-list"
        class="btn-cancel-list"
      >
        Cancelar
      </button>
      </div>
    
   
    </form>
  </div>
</div>
 
<div id="modal-delete-list" hidden>
  <div class="delete-list-content">
    <div class="delete-list-heading">
      <span class="delete-list-icon">
        <i class="fa-regular fa-trash-can" aria-hidden="true"></i>
      </span>
      <h2>Excluir lista?</h2>
    </div>

    <p>
      A lista <strong id="delete-list-name"></strong> e seus
      <strong id="delete-list-movie-count"></strong>
      serão removidos.
      <br />
      Essa ação não pode ser desfeita.
    </p>

    <div class="delete-list-buttons">
      <button type="button" id="btn-cancel-delete-list">
        Cancelar
      </button>

      <button type="button" id="btn-confirm-delete-list">
        Excluir
      </button>
    </div>
  </div>
</div>



    <div id="footer"></div>

    <script src="./js/load-components.js"></script>
    <script src="./js/header.js"></script>
    <script src="./js/components/cards.js"></script>
    <script src="./js/lists.js"></script>
    
  </body>
</html>
