<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categorias | Movvi</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div id="header"></div>
    <main style="min-height: 100vh">
      <section class="categories">
        <h1 class="categories-title">Categorias</h1>
        <nav
          class="categories-filter"
          aria-label="Filtrar filmes por categoria"
        >

          <button class="category-chip">Ação</button>
          <button class="category-chip">Comédia</button>
          <button class="category-chip">Romance</button>
          <button class="category-chip">Drama</button>
          <button class="category-chip">Terror</button>
          <button class="category-chip">Suspense</button>
          <button class="category-chip">Ficção</button>
          <button class="category-chip">Aventura</button>

        </nav>

        <select id="sort-movies">
    <option value="vote.desc">Melhor avaliação</option>
    <option value="vote.asc">Pior avaliação</option>
    <option value="popularity.desc">Mais populares</option>
    <option value="release_date.desc">Mais recentes</option>
    <option value="release_date.asc">Mais antigos</option>
</select>



        <div class="categories-container" id="categories-container">
                      
           
        </div>
      </section>
      
    </main>
    <div id="footer"></div>

    <script src="./js/api.js/api.js"></script>
    <script src="./js/load-components.js"></script>
    <script src="./js/header.js"></script>
    <script src="./js/components/cards.js"></script>
    <script src="./js/categories.js"></script>
        
    
  </body>
</html>
