
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categorias | Movvi</title>

    <link rel="stylesheet" href="./css/style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <div id="header"></div>

    <main class="main-categories">
      <section class="categories">

        <h1 class="categories-title">Categorias</h1>

        <nav
          class="categories-filter"
          aria-label="Filtrar filmes por categoria"
        >
          <button class="category-chip">Ação</button>
          <button class="category-chip">Comédia</button>
          <button class="category-chip">Romance</button>
          <button class="category-chip">Drama</button>
          <button class="category-chip">Terror</button>
          <button class="category-chip">Suspense</button>
          <button class="category-chip">Ficção</button>
          <button class="category-chip">Aventura</button>
        </nav>

        <div class="discover">
          <h2 class="discover-title">Descubra</h2>

          <div class="discover-options">

            <button class="discover-button" data-discover="trending">
              <i class="fa-solid fa-fire" aria-hidden="true"></i>
              <span class="shortcut">Em alta</span>
            </button>

            <button class="discover-button" data-discover="top-rated">
              <i class="fa-solid fa-star" aria-hidden="true"></i>
              <span class="shortcut">Bem avaliados</span>
            </button>

            <button class="discover-button" data-discover="popular-rated">
              <i class="fa-solid fa-award" aria-hidden="true"></i>
              <span class="shortcut">Populares e bem avaliados</span>
            </button>

            <button class="discover-button" data-discover="hidden-gems">
              <i class="fa-solid fa-gem" aria-hidden="true"></i>
              <span class="shortcut">Joias escondidas</span>
            </button>

          </div>
        </div>

        <div
          class="categories-container"
          id="categories-container"
        ></div>

        <div class="pagination" id="pagination"></div>

      </section>
    </main>

    <div id="footer"></div>

    <script src="./js/api/api.js"></script>
    <script src="./js/load-components.js"></script>
    <script src="./js/header.js"></script>
    <script src="./js/components/cards.js"></script>
    <script src="./js/categories.js"></script>
  </body>
</html>
